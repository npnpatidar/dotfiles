name: "Run nix flake check"

on:
  push:
    branches: ["dendritic"]
  pull_request:
    branches: ["dendritic"]

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: DeterminateSystems/nix-installer-action@252ce0ac769a3b5e2f2869cbdbb0e050f23a5a90 # v1
      - run: nix flake check
